         .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Creates 3 equal columns */
            gap: 15px; /* Space between the images */
            max-width: 900px;
            margin: 0 auto; /* Center the grid on the page */
        }

        /* Styling for each image container */
        .image-item {
            background-color: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
          /* Styling for the pictures */
        .image-item img {
            width: 100%; /* Make image fit the column width */
            height: 200px; /* Uniform height for all images */
            object-fit: cover; /* Keeps image proportions clean */
            border-radius: 4px;
        }

        /* Responsive design for smaller screens */
        @media (max-width: 600px) {
            .image-grid {
                grid-template-columns: repeat(2, 1fr); /* 2 columns on smaller screens */
            }
        }
